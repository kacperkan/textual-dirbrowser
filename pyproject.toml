[project]
name = "textual-dirbrowser"
version = "0.1.0"
description = "Textual TUI directory browser with injectable listing backends (local FS, S3, remote — you supply the callbacks)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80.0",
    "rich>=14.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/textual_dirbrowser"]

[tool.ruff]
line-length = 119
indent-width = 4
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The test file groups imports with the section they exercise (style inherited
# from the source repo).
"tests/*" = ["E402"]
